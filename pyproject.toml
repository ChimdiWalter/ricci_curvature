[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ricci-cell-fate"
version = "0.1.0"
description = "Discrete Ricci curvature for transition-region ranking in single-cell lineage graphs"
authors = [{name = "Chimdi Walter Ndubuisi", email = "cnptp@missouri.edu"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "networkx",
    "scanpy",
    "anndata",
]

[project.optional-dependencies]
datasets = ["cellrank"]
validation = ["decoupler"]

[tool.setuptools.packages.find]
where = ["src"]
